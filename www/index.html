<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>كتيّب السيارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#c8102e; --primary-dark:#8a0b1f; --primary-light:#fdeef1;
  --accent:#d4a017; --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --bg:#f2f3f7; --surface:#ffffff; --surface-2:#f8f9fc;
  --text:#0f172a; --text-muted:#64748b; --border:#e5e8ef;
  --radius:18px; --radius-sm:12px; --radius-xs:8px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 4px 14px rgba(15,23,42,.08);
  --shadow-lg:0 16px 40px rgba(15,23,42,.16);
  --nav-h:66px; --header-h:58px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow:hidden;height:100%}
body{
  font-family:'Tajawal',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  user-select:none;
}
input,textarea{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input{font-family:inherit;border:none;outline:none;background:transparent;color:inherit;font-size:inherit}

/* ============ APP SHELL ============ */
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.app-bar{
  height:calc(var(--header-h) + var(--safe-top));
  padding:var(--safe-top) 20px 0;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:10;box-shadow:0 2px 12px rgba(200,16,46,.28);
}
.app-bar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:rgba(255,255,255,.15);
}
.app-bar-title{font-size:17px;font-weight:900;letter-spacing:-.3px}
.app-bar-sub{font-size:11px;opacity:.78;font-weight:600;margin-top:-2px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);font-size:17px;
  transition:transform .15s, background .15s;
}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.28)}

/* ============ SCREENS ============ */
.screens{
  flex:1;position:relative;overflow:hidden;
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom));
}
.screen{
  position:absolute;inset:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
  padding:18px 16px 24px;
}
.screen.active{opacity:1;pointer-events:auto}
.screen::-webkit-scrollbar{display:none}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
  display:flex;position:relative;z-index:10;
  box-shadow:0 -2px 12px rgba(15,23,42,.05);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--text-muted);position:relative;
  transition:color .18s;padding:8px 4px;
}
.nav-btn:active .nav-icon{transform:scale(.88)}
.nav-icon{font-size:21px;line-height:1;transition:transform .18s;filter:grayscale(1) opacity(.6)}
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:-.2px}
.nav-btn.active{color:var(--primary)}
.nav-btn.active .nav-icon{filter:none;transform:translateY(-1px)}
.nav-btn.active::before{
  content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--primary);
}

/* ============ CARDS & COMPONENTS ============ */
.card{
  background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:16px;margin-bottom:14px;
  border:1px solid rgba(15,23,42,.04);
}
.card-title{font-size:14px;font-weight:900;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.card-title .count{font-size:11px;color:var(--text-muted);font-weight:800;background:var(--surface-2);padding:3px 9px;border-radius:20px}

.vehicle-card{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;border-radius:var(--radius);padding:18px;
  margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(200,16,46,.32);
}
.vehicle-card::before{
  content:'';position:absolute;top:-40%;left:-20%;width:220px;height:220px;
  background:radial-gradient(circle,rgba(255,255,255,.14) 0%,transparent 70%);
  pointer-events:none;
}
.vehicle-card::after{
  content:'🚗';position:absolute;bottom:-10px;left:10px;
  font-size:88px;opacity:.14;pointer-events:none;line-height:1;
}
.vc-name{font-size:20px;font-weight:900;letter-spacing:-.4px;margin-bottom:4px}
.vc-plate{font-size:12px;opacity:.85;font-weight:700;letter-spacing:1px;margin-bottom:14px}
.vc-km{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.vc-km-val{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1}
.vc-km-unit{font-size:13px;opacity:.85;font-weight:700}
.vc-km-lbl{font-size:11px;opacity:.75;font-weight:700;margin-bottom:6px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{
  background:var(--surface);border-radius:var(--radius-sm);padding:12px 10px;
  text-align:center;box-shadow:var(--shadow-sm);
  border:1px solid rgba(15,23,42,.04);
}
.stat-val{font-size:22px;font-weight:900;letter-spacing:-.6px;color:var(--text);line-height:1.1}
.stat-val.danger{color:var(--danger)}
.stat-val.warning{color:var(--warning)}
.stat-val.success{color:var(--success)}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:800;margin-top:4px}

/* Task list */
.task-list{display:flex;flex-direction:column;gap:10px}
.task-item{
  background:var(--surface);border-radius:var(--radius-sm);padding:14px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);border:1px solid rgba(15,23,42,.04);
  position:relative;overflow:hidden;
}
.task-item::before{
  content:'';position:absolute;top:0;bottom:0;right:0;width:4px;
  background:var(--primary);
}
.task-item.p-ok::before{background:var(--success)}
.task-item.p-soon::before{background:var(--warning)}
.task-item.p-urgent::before{background:var(--danger)}
.task-item.p-overdue::before{background:#7d0d1c}
.task-icon{
  width:42px;height:42px;border-radius:12px;
  background:var(--primary-light);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.task-body{flex:1;min-width:0}
.task-name{font-size:13.5px;font-weight:800;color:var(--text);margin-bottom:3px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task-meta{font-size:11px;color:var(--text-muted);font-weight:700}
.task-meta.danger{color:var(--danger);font-weight:900}
.task-meta.warning{color:#b45309;font-weight:900}
.task-meta.success{color:var(--success);font-weight:900}

/* List items */
.list{display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:14px}
.list-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border);position:relative;
}
.list-item:last-child{border-bottom:none}
.list-item .li-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.list-item .li-body{flex:1;min-width:0}
.list-item .li-title{font-size:13.5px;font-weight:800;color:var(--text)}
.list-item .li-sub{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:1px}

/* Form row */
.form-row{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-bottom:1px solid var(--border)}
.form-row:last-child{border-bottom:none}
.form-row label{font-size:11px;color:var(--text-muted);font-weight:800;letter-spacing:.2px}
.form-row input{
  font-size:15px;font-weight:700;color:var(--text);width:100%;
  padding:6px 0;border-bottom:1.5px solid transparent;
  transition:border-color .15s;
}
.form-row input:focus{border-bottom-color:var(--primary)}
.form-row input::placeholder{color:#b0b6c2;font-weight:600}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* Checkbox rows */
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.check-row:last-child{border-bottom:none}
.cb{
  appearance:none;-webkit-appearance:none;width:22px;height:22px;flex-shrink:0;
  border:2px solid var(--border);border-radius:7px;background:var(--surface);
  transition:all .15s;position:relative;cursor:pointer;
}
.cb:checked{background:var(--primary);border-color:var(--primary)}
.cb:checked::after{
  content:'✓';position:absolute;inset:0;color:#fff;
  font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;
}
.cb:active{transform:scale(.9)}
.check-row .cr-text{font-size:13.5px;font-weight:700;flex:1;color:var(--text)}
.check-row.done .cr-text{text-decoration:line-through;color:var(--text-muted)}

/* Segmented control */
.segment{
  display:flex;background:var(--surface-2);padding:4px;border-radius:12px;
  margin-bottom:14px;gap:2px;
}
.segment button{
  flex:1;padding:9px 8px;border-radius:9px;
  font-size:12.5px;font-weight:800;color:var(--text-muted);
  transition:all .18s;letter-spacing:-.2px;
}
.segment button.active{
  background:var(--surface);color:var(--primary);
  box-shadow:0 2px 8px rgba(15,23,42,.08);
}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 18px;border-radius:12px;font-weight:800;font-size:13.5px;
  transition:transform .12s, background .15s;letter-spacing:-.2px;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(200,16,46,.32)}
.btn-outline{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-full{width:100%}

/* FAB */
.fab{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);left:20px;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-size:28px;font-weight:300;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(200,16,46,.45);
  transition:transform .18s;z-index:20;
}
.fab:active{transform:scale(.9)}
.fab.hidden{display:none}

/* Bottom sheet */
.backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;
}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-radius:22px 22px 0 0;
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  z-index:101;padding-bottom:var(--safe-bottom);
}
.sheet.show{transform:translateY(0)}
.sheet-handle{
  width:38px;height:4px;background:var(--border);border-radius:4px;
  margin:10px auto 4px;flex-shrink:0;
}
.sheet-header{
  padding:10px 20px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sheet-title{font-size:16px;font-weight:900;color:var(--text)}
.sheet-close{
  width:32px;height:32px;border-radius:50%;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:18px;
}
.sheet-body{padding:16px 20px 24px;overflow-y:auto;flex:1}
.sheet-footer{padding:12px 20px 18px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}

/* Toast */
.toast{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 20px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;font-size:13px;font-weight:700;
  padding:12px 20px;border-radius:24px;
  box-shadow:0 8px 24px rgba(0,0,0,.32);
  opacity:0;pointer-events:none;transition:all .25s;z-index:200;
  max-width:90vw;text-align:center;display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#064e3b}
.toast.err{background:#7f1d1d}

/* Priority dot */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.p-ok{background:var(--success)}
.dot.p-soon{background:var(--warning)}
.dot.p-urgent{background:var(--danger)}
.dot.p-overdue{background:#7d0d1c;box-shadow:0 0 0 3px rgba(125,13,28,.18)}

/* Empty state */
.empty{
  text-align:center;padding:40px 20px;color:var(--text-muted);
  font-size:13px;font-weight:600;
}
.empty-icon{font-size:48px;opacity:.35;margin-bottom:10px;display:block}

/* Time grid */
.grid-weeks{display:flex;flex-direction:column;gap:6px}
.grid-week-row{display:flex;align-items:center;gap:4px}
.q-lbl{font-size:10px;font-weight:900;color:var(--primary);width:22px;flex-shrink:0}
.wbox{flex:1;height:14px;border:1.5px solid var(--border);border-radius:3px;background:var(--surface);
  appearance:none;-webkit-appearance:none;min-width:0}
.wbox:checked{background:var(--primary);border-color:var(--primary)}
.grid-months{display:flex;gap:4px}
.month-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.m-lbl{font-size:9px;font-weight:800;color:var(--text-muted)}
.mbox{width:100%;aspect-ratio:1;max-width:26px;border:1.5px solid var(--border);border-radius:5px;
  background:var(--surface);appearance:none;-webkit-appearance:none}
.mbox:checked{background:var(--primary);border-color:var(--primary)}

/* Reference grid */
.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.ref-card{
  background:var(--surface);border-radius:var(--radius);
  padding:18px 14px;text-align:center;
  box-shadow:var(--shadow-sm);border:1px solid rgba(15,23,42,.04);
  transition:transform .15s;
}
.ref-card:active{transform:scale(.96)}
.ref-icon{font-size:32px;line-height:1;margin-bottom:8px}
.ref-title{font-size:13px;font-weight:900;color:var(--text);letter-spacing:-.2px}
.ref-sub{font-size:10.5px;color:var(--text-muted);font-weight:700;margin-top:3px}

/* KM strip */
.km-strip{display:flex;gap:5px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.km-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:32px}
.km-num{font-size:10px;font-weight:900;color:var(--text)}
.km-box{width:32px;height:32px;border:1.5px solid var(--border);background:var(--surface);
  border-radius:6px;appearance:none;-webkit-appearance:none}
.km-box:checked{background:var(--primary);border-color:var(--primary)}

/* Animations */
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.screen.active > *{animation:fadeInUp .35s cubic-bezier(.22,1,.36,1) both}
.screen.active > *:nth-child(2){animation-delay:.05s}
.screen.active > *:nth-child(3){animation-delay:.1s}
.screen.active > *:nth-child(4){animation-delay:.15s}

/* Small utility */
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--text-muted);font-size:11px;font-weight:700}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}
</style>
</head>
<body>

<div class="app">
  <!-- APP BAR -->
  <header class="app-bar">
    <div>
      <div class="app-bar-title" id="headerTitle">كتيّب السيارة</div>
      <div class="app-bar-sub" id="headerSub">الصيانة الذكية</div>
    </div>
    <button class="icon-btn" id="appBarAction">⚙️</button>
  </header>

  <!-- SCREENS -->
  <main class="screens">

    <!-- HOME -->
    <section class="screen active" data-screen="home">
      <div class="vehicle-card">
        <div class="vc-name" id="vcName">— سيارة —</div>
        <div class="vc-plate" id="vcPlate">— · —</div>
        <div class="vc-km-lbl">قراءة العداد الحالية</div>
        <div class="vc-km">
          <span class="vc-km-val" id="vcKm">0</span>
          <span class="vc-km-unit">كم</span>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat"><div class="stat-val" id="statNext">—</div><div class="stat-lbl">مهمة قادمة</div></div>
        <div class="stat"><div class="stat-val" id="statDays">—</div><div class="stat-lbl">يوم متبقي</div></div>
        <div class="stat"><div class="stat-val" id="statAlerts">—</div><div class="stat-lbl">تنبيهات</div></div>
      </div>

      <div class="card-title" style="padding:0 4px;margin-bottom:12px">
        المهام القادمة <span class="count" id="upcomingCount">0</span>
      </div>
      <div class="task-list" id="homeTasks"></div>
    </section>

    <!-- TASKS -->
    <section class="screen" data-screen="tasks">
      <div class="segment" id="taskSeg">
        <button class="active" data-view="km">🛣️ حسب المسافة</button>
        <button data-view="time">📅 حسب الوقت</button>
      </div>
      <div id="tasksContent"></div>
    </section>

    <!-- LOGS -->
    <section class="screen" data-screen="logs">
      <div class="segment" id="logSeg">
        <button class="active" data-view="fuel">⛽ الوقود</button>
        <button data-view="repairs">🔧 الإصلاحات</button>
        <button data-view="tires">🛞 الإطارات</button>
      </div>
      <div id="logsContent"></div>
    </section>

    <!-- REFERENCE -->
    <section class="screen" data-screen="ref">
      <div class="ref-grid">
        <button class="ref-card" data-ref="catalog"><div class="ref-icon">📋</div><div class="ref-title">كتالوج القطع</div><div class="ref-sub">المواصفات</div></button>
        <button class="ref-card" data-ref="workshops"><div class="ref-icon">🏢</div><div class="ref-title">الورش</div><div class="ref-sub">جهات موثوقة</div></button>
        <button class="ref-card" data-ref="warranty"><div class="ref-icon">🛡️</div><div class="ref-title">الضمانات</div><div class="ref-sub">القطع والوثائق</div></button>
        <button class="ref-card" data-ref="emergency"><div class="ref-icon">🚨</div><div class="ref-title">الطوارئ</div><div class="ref-sub">أرقام مهمة</div></button>
        <button class="ref-card" data-ref="warnings"><div class="ref-icon">⚠️</div><div class="ref-title">علامات التحذير</div><div class="ref-sub">دليل سريع</div></button>
        <button class="ref-card" data-ref="tires"><div class="ref-icon">💨</div><div class="ref-title">ضغط الإطارات</div><div class="ref-sub">PSI موصى به</div></button>
      </div>
      <button class="btn btn-outline btn-full" onclick="window.print()">🖨️ طباعة الكُتيّب كاملاً</button>
    </section>

    <!-- SETTINGS -->
    <section class="screen" data-screen="settings">
      <div class="card">
        <div class="card-title">🚗 بيانات المركبة</div>
        <div class="form-grid">
          <div class="form-row"><label>المالك</label><input data-p="meta.owner" placeholder="—"></div>
          <div class="form-row"><label>الجوال</label><input data-p="meta.phone" placeholder="—"></div>
          <div class="form-row"><label>نوع السيارة</label><input data-p="meta.car" placeholder="—"></div>

let S=loadState();
function loadState(){
  try{const r=localStorage.getItem(LS);if(!r)return structuredClone(DEFAULT);return merge(structuredClone(DEFAULT),JSON.parse(r));}
  catch(e){return structuredClone(DEFAULT);}
}
function saveState(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function merge(base,over){
  if(Array.isArray(base))return Array.isArray(over)?over:base;
  if(base&&typeof base==='object'){
    const o={...base};
    if(over&&typeof over==='object'){
      for(const k in base)if(k in over)o[k]=merge(base[k],over[k]);
      for(const k in over)if(!(k in base))o[k]=over[k];
    }
    return o;
  }
  return over===undefined?base:over;
}
function getP(obj,path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],obj);}
function setP(obj,path,val){
  const p=path.split('.');let c=obj;
  for(let i=0;i<p.length-1;i++)c=c[p[i]];
  c[p[p.length-1]]=val;
}

/* ---- HOME ---- */
function renderHome(){
  document.getElementById('vcName').textContent=S.meta.car||'— سيارة —';
  document.getElementById('vcPlate').textContent=(S.meta.plate||'—')+' · '+(S.meta.year||'—');
  document.getElementById('vcKm').textContent=fmtNum(parseKm(S.currentKm)||0);

  const km=parseKm(S.currentKm);
  const {byKm,byTime}=computeUpcoming();
  const all=[...byKm.map(x=>({...x,type:'km'})),...byTime.map(x=>({...x,type:'time'}))].sort((a,b)=>{
    const ra=a.type==='km'?a.remaining:null,rb=b.type==='km'?b.remaining:null;
    const da=a.type==='time'?a.daysLeft:null,db=b.type==='time'?b.daysLeft:null;
    const sa=a.type==='km'?a.remaining/100:a.daysLeft*5;
    const sb=b.type==='km'?b.remaining/100:b.daysLeft*5;
    return sa-sb;
  });
  document.getElementById('statNext').textContent=all.length?Math.min(all.length,99):'0';
  const urgent=all.filter(x=>(x.type==='km'&&x.remaining<1000)||(x.type==='time'&&x.daysLeft<=14)).length;
  document.getElementById('statAlerts').textContent=urgent;
  document.getElementById('statAlerts').className='stat-val'+(urgent>0?' danger':'');
  const nextTime=byTime[0];
  document.getElementById('statDays').textContent=nextTime?Math.max(0,nextTime.daysLeft):'—';

  document.getElementById('upcomingCount').textContent=all.length;
  const el=document.getElementById('homeTasks');
  if(!all.length){
    el.innerHTML=`<div class="empty"><span class="empty-icon">✨</span>كل شيء تحت السيطرة<br><span style="font-size:11px">أضف قراءة العداد في الإعدادات</span></div>`;
    return;
  }
  el.innerHTML=all.slice(0,6).map(t=>{
    const icon=t.type==='km'?'🛣️':'📅';
    let cls='p-ok',meta='';
    if(t.type==='km'){
      if(t.remaining<0){cls='p-overdue';meta=`متأخرة بـ ${fmtNum(-t.remaining)} كم`;}
      else if(t.remaining<1000){cls='p-urgent';meta=`بعد ${fmtNum(t.remaining)} كم`;}
      else if(t.remaining<3000){cls='p-soon';meta=`بعد ${fmtNum(t.remaining)} كم`;}
      else{cls='p-ok';meta=`بعد ${fmtNum(t.remaining)} كم`;}
    }else{
      if(t.daysLeft<0){cls='p-overdue';meta=`متأخرة ${fmtNum(-t.daysLeft)} يوم`;}
      else if(t.daysLeft<=14){cls='p-urgent';meta=`بعد ${t.daysLeft} يوم`;}
      else if(t.daysLeft<=30){cls='p-soon';meta=`بعد ${t.daysLeft} يوم`;}
      else{cls='p-ok';meta=`بعد ${Math.round(t.daysLeft/30)} شهر`;}
    }
    const name=cleanTask(t.tasks[0]||'مهمة');
    const extra=t.tasks.length>1?` +${t.tasks.length-1}`:'';
    const metaCls=cls==='p-overdue'||cls==='p-urgent'?'danger':cls==='p-soon'?'warning':'success';
    return `<div class="task-item ${cls}">
      <div class="task-icon">${icon}</div>
      <div class="task-body">
        <div class="task-name">${esc(name)}${extra}</div>
        <div class="task-meta ${metaCls}">${meta}</div>
      </div>
    </div>`;
  }).join('');
}

          </div>`).join('')}

    }).join('');

      el.addEventListener('change',e=>{
        const [i,j]=e.target.dataset.km.split('-').map(Number);
        S.distance[i].kms[j].done=e.target.checked;
        saveState();renderScreen('tasks');
      });
    });
  }else{
    c.innerHTML=S.time.map((row,i)=>{
      const done=row.grid.filter(Boolean).length;
      return `<div class="card">
        <div class="card-title"><span>${esc(row.freq)} — ${esc(row.count)}</span><span class="count">${done}/${row.grid.length}</span></div>
        ${row.tasks.map(t=>`<div class="check-row" style="border:none;padding:5px 0"><span style="font-size:13px;font-weight:700">${t.icon||''} ${esc(t.name||'')}</span></div>`).join('')}
        <div style="margin-top:10px">${renderGrid(row,i)}</div>
      </div>`;
    }).join('');

      el.addEventListener('change',e=>{
        const [i,j]=e.target.dataset.tg.split('-').map(Number);
        S.time[i].grid[j]=e.target.checked;
        saveState();
      });
    });
  }
}
function renderGrid(row,i){
  const g=row.grid,t=row.gridType;
  if(t==='weeks'){
    let h='<div class="grid-weeks">';
    for(let q=0;q<4;q++){
      h+=`<div class="grid-week-row"><span class="q-lbl">Q${q+1}</span>`;
      for(let w=0;w<13;w++){const k=q*13+w;h+=`<input type="checkbox" class="wbox" data-tg="${i}-${k}" ${g[k]?'checked':''}>`;}
      h+='</div>';
    }
    return h+'</div>';
  }
  if(t==='months'){
    const m=['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];
    return `<div class="grid-months">${m.map((x,k)=>`<div class="month-item"><span class="m-lbl">${x}</span><input type="checkbox" class="mbox" data-tg="${i}-${k}" ${g[k]?'checked':''}></div>`).join('')}</div>`;
  }
  if(t==='quarters')return `<div class="grid-months">${['Q1','Q2','Q3','Q4'].map((x,k)=>`<div class="month-item"><span class="m-lbl">${x}</span><input type="checkbox" class="mbox" data-tg="${i}-${k}" ${g[k]?'checked':''}></div>`).join('')}</div>`;
  if(t==='halves')return `<div class="grid-months">${['H1','H2'].map((x,k)=>`<div class="month-item"><span class="m-lbl">${x}</span><input type="checkbox" class="mbox" data-tg="${i}-${k}" ${g[k]?'checked':''}></div>`).join('')}</div>`;
  return `<div class="grid-months">${['سنوي'].map((x,k)=>`<div class="month-item"><span class="m-lbl">${x}</span><input type="checkbox" class="mbox" data-tg="${i}-0" ${g[0]?'checked':''}></div>`).join('')}</div>`;
}

      <div class="li-icon">${coll==='fuel'?'⛽':coll==='repairs'?'🔧':'🛞'}</div>

        <div class="li-title">${esc(r[fields[2].split(':')[1]]||r[fields[0].split(':')[1]]||'سجل')}</div>
        <div class="li-sub">${esc(r.date||'')} ${r.odo?`· ${esc(r.odo)} كم`:''}</div>
      </div>
      <span style="color:var(--text-muted);font-size:18px">‹</span>
    </div>
  `).join('')}</div>`;
}

/* =========================================================
   BOTTOM SHEET
   ========================================================= */
const sheet=document.getElementById('sheet'),backdrop=document.getElementById('backdrop');
function openSheet(title,bodyHTML,footerHTML){
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetBody').innerHTML=bodyHTML;
  document.getElementById('sheetFooter').innerHTML=footerHTML||'';
  sheet.classList.add('show');backdrop.classList.add('show');
}
function closeSheet(){sheet.classList.remove('show');backdrop.classList.remove('show');}
backdrop.addEventListener('click',closeSheet);
document.getElementById('sheetClose').addEventListener('click',closeSheet);

function openLogEntry(coll,idx){
  const r=S[coll][idx];
  const labels={fuel:['⛽ تعبئة وقود',['التاريخ','العداد (كم)','اللترات','السعر/لتر','المبلغ','كم/لتر','ملاحظات'],['date','odo','liters','price','amount','kmpl','notes']],
    repairs:['🔧 إصلاح',['التاريخ','العداد','الوصف','الورشة','التكلفة','ملاحظات'],['date','odo','desc','shop','cost','notes']],
    rotations:['🛞 تبديل إطارات',['التاريخ','العداد','النمط','الورشة','ملاحظات'],['date','odo','pattern','shop','notes']]};
  const [title,labels2,keys]=labels[coll];
  openSheet(title,`<div>${keys.map((k,i)=>`<div class="form-row"><label>${labels2[i]}</label><input data-k="${k}" value="${esc(r[k]||'')}"></div>`).join('')}</div>`,
    `<button class="btn btn-outline grow" onclick="closeSheet()">إلغاء</button>
     <button class="btn btn-primary grow" id="saveEntry">حفظ</button>`);
  document.getElementById('saveEntry').onclick=()=>{
    document.querySelectorAll('#sheetBody [data-k]').forEach(inp=>{r[inp.dataset.k]=inp.value;});
    saveState();closeSheet();renderScreen('logs');toast('تم الحفظ ✓','ok');
  };
}

/* FAB */
document.getElementById('fab').addEventListener('click',()=>{
  const emptyIdx=S[currentLogView].findIndex(r=>!Object.values(r).some(v=>v));
  const idx=emptyIdx>=0?emptyIdx:S[currentLogView].length;
  if(emptyIdx<0){
    const blank={};Object.keys(S[currentLogView][0]||{date:''}).forEach(k=>blank[k]='');
    S[currentLogView].push(blank);
  }
  openLogEntry(currentLogView,idx);
});

/* =========================================================
   REFERENCE SHEETS
   ========================================================= */
document.querySelectorAll('[data-ref]').forEach(b=>{
  b.addEventListener('click',()=>openRef(b.dataset.ref));
});
function openRef(type){
  let title='',body='';
  if(type==='catalog'){
    title='📋 كتالوج القطع';
    body=S.catalog.map((c,i)=>`<div class="card" style="margin-bottom:10px">
      <div class="card-title">${c.num}. ${esc(c.title)}</div>
      ${c.lines.map((ln,j)=>`<div class="form-row"><label>${esc(ln.l)}</label><input data-c="${i}-${j}" value="${esc(ln.v)}" placeholder="—"></div>`).join('')}
    </div>`).join('');
  }else if(type==='workshops'){
    title='🏢 الورش المعتمدة';
    body=S.workshops.map((w,i)=>`<div class="card" style="margin-bottom:10px">
      <div class="card-title">${w.icon} ${esc(w.title)}</div>
      ${w.lines.map((ln,j)=>`<div class="form-row"><label>${esc(ln.l)}</label><input data-w="${i}-${j}" value="${esc(ln.v)}" placeholder="—"></div>`).join('')}
    </div>`).join('');
  }else if(type==='warranty'){
    title='🛡️ الضمانات';
    body=S.warranty.map((w,i)=>`<div class="card" style="margin-bottom:10px">
      <div class="form-row"><label>القطعة</label><input data-wr="${i}-part" value="${esc(w.part)}"></div>
      <div class="form-row"><label>تاريخ التركيب</label><input data-wr="${i}-date" value="${esc(w.date)}"></div>
      <div class="form-row"><label>ينتهي في</label><input data-wr="${i}-until" value="${esc(w.until)}"></div>
      <div class="form-row"><label>الورشة</label><input data-wr="${i}-shop" value="${esc(w.shop)}"></div>
    </div>`).join('');
  }else if(type==='emergency'){
    title='🚨 أرقام الطوارئ';
    body=S.emergency.map((e,i)=>`<div class="list-item" style="background:var(--surface);border-radius:12px;margin-bottom:8px">
      <div class="li-body"><div class="li-title">${esc(e.l)}</div></div>
      <input data-em="${i}" value="${esc(e.v)}" style="font-size:16px;font-weight:900;color:var(--primary);text-align:left;width:100px">
    </div>`).join('');
  }else if(type==='warnings'){
    title='⚠️ علامات التحذير';
    body=S.warnings.map(w=>`<div class="card" style="margin-bottom:10px">
      <div style="font-size:14px;font-weight:900;margin-bottom:6px">${esc(w.sign)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:3px">السبب: ${esc(w.cause)}</div>
      <div style="font-size:12px;color:var(--primary);font-weight:900">الإجراء: ${esc(w.action)}</div>
    </div>`).join('');
  }else if(type==='tires'){
    title='💨 ضغط الإطارات (PSI)';
    body=S.tires.map((t,i)=>`<div class="form-row"><label>${esc(t.l)}</label><input data-t="${i}" value="${esc(t.v)}" placeholder="—" inputmode="numeric"></div>`).join('');
  }
  openSheet(title,body,`<button class="btn btn-primary grow" id="saveRef">حفظ</button>`);
  document.getElementById('saveRef').onclick=()=>{
    document.querySelectorAll('#sheetBody input').forEach(inp=>{
      if(inp.dataset.c){const [i,j]=inp.dataset.c.split('-').map(Number);S.catalog[i].lines[j].v=inp.value;}
      else if(inp.dataset.w){const [i,j]=inp.dataset.w.split('-').map(Number);S.workshops[i].lines[j].v=inp.value;}
      else if(inp.dataset.wr){const [i,k]=inp.dataset.wr.split('-');S.warranty[i][k]=inp.value;}
      else if(inp.dataset.em!==undefined){S.emergency[Number(inp.dataset.em)].v=inp.value;}
      else if(inp.dataset.t!==undefined){S.tires[Number(inp.dataset.t)].v=inp.value;}
    });
    saveState();closeSheet();toast('تم الحفظ ✓','ok');
  };
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='car-logbook-'+todayIso()+'.json';
  a.click();URL.revokeObjectURL(a.href);
  toast('تم التصدير ✓','ok');

/* =========================================================
   UPCOMING COMPUTATION
   ========================================================= */
function computeUpcoming(){
  const byKm=[],byTime=[];
  const km=parseKm(S.currentKm);
  const now=S.currentDate?new Date(S.currentDate+'T00:00:00'):new Date();
  if(km!=null){
    S.distance.forEach(row=>{
      let best=null;
      row.kms.forEach(k=>{if(k.done)return;const v=parseFloat(k.v);if(isNaN(v))return;const a=v*1000;if(best===null||a<best)best=a;});
      if(best!==null)byKm.push({interval:row.interval,tasks:row.tasks.slice(),nextKm:best,remaining:best-km});
    });
    byKm.sort((a,b)=>a.remaining-b.remaining);
  }
  const start=parseDate(S.meta.start);
  if(start){
    S.time.forEach(row=>{
      const pd=PERIOD_DAYS[row.gridType]||30,g=row.grid||[];
      let ni=-1;for(let k=0;k<g.length;k++)if(!g[k]){ni=k;break;}
      if(ni<0)return;
      const due=new Date(start.getTime()+(ni+1)*pd*86400000);
      const dl=Math.round((due-now)/86400000);
      byTime.push({freq:row.freq,tasks:row.tasks.map(t=>(t.icon?t.icon+' ':'')+(t.name||'')),dueDate:due,daysLeft:dl});
    });
    byTime.sort((a,b)=>a.daysLeft-b.daysLeft);
  }
  return {byKm,byTime};
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtNum(n){if(n==null||isNaN(n))return'0';return Math.round(n).toLocaleString('en-US');}
function parseKm(v){const n=parseFloat(String(v||'').replace(/[^\d.\-]/g,''));return isNaN(n)?null:n;}
function cleanTask(t){return String(t||'').replace(/^[\p{Emoji}\u200d\ufe0f\s]+/u,'').trim()||String(t||'');}
function todayIso(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;}
function parseDate(s){
  if(!s)return null;s=String(s).trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  return null;
}
let toastTimer;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
